<!DOCTYPE html>
<html>
<head>
  <title>LeetCode Reminder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2> Daily LeetCode</h2>
  <button id="openLeetCode">Solve Now</button>
  <button id="markDone">Mark as Done ✅</button>
  <p id="streak">Streak: 0</p>

  <input type="time" id="reminderTime" />
<button id="setReminder">Set Reminder</button>

<h4>Snooze</h4>
<button class="snooze" data-time="5">5 min</button>
<button class="snooze" data-time="10">10 min</button>
<button class="snooze" data-time="15">15 min</button>
  <script src="popup.js"></script>
</body>
</html>
